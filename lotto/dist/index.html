<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2"><meta name="description" content="버튼 한 번으로 뽑는 나만의 로또 6/45 번호. 로또 번호와 이벤트 당첨 번호를 중복 없이 추첨하세요.">
<title>행운 한 줌 — 로또 · 이벤트 추첨기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#243d33;font-family:Arial,"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer}header{max-width:1120px;margin:auto;padding:30px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dfe3da}.brand{font-weight:800;font-size:20px;letter-spacing:-1px}.clover{color:#3f7858;margin-right:9px;font-size:27px}.tag{font-size:12px;letter-spacing:2px;color:#718176}main{max-width:900px;margin:64px auto 40px;padding:0 24px}.intro{text-align:center}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#708b61}h1{font-size:clamp(32px,6vw,49px);letter-spacing:-2px;margin:19px 0 16px;line-height:1.3}.intro p{color:#7c827a;font-size:15px;line-height:1.8}.draw-card{margin-top:38px;background:#fff;border:1px solid #e1e5dc;border-radius:24px;padding:30px 36px 32px;box-shadow:0 12px 40px #243d3305}.card-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#879083}.label{display:inline-flex;align-items:center;gap:7px;color:#54724d;font-weight:700}.dot{width:6px;height:6px;background:#739a55;border-radius:50%}.balls{flex-wrap:wrap;display:flex;justify-content:center;gap:17px;padding:46px 0 37px}.ball{width:80px;height:80px;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:29px;background:#f0f2ed;color:#a6afa1;border:1px solid #e6eae2;position:relative}.ball.filled{color:#fff;border:0;box-shadow:inset 0 -5px 0 #0000000d;animation:pop .35s ease both}.yellow{background:#dba73c}.blue{background:#5599c7}.red{background:#df7d72}.gray{background:#8b9296}.green{background:#78a374}@keyframes pop{from{transform:translateY(-14px) scale(.85);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.status{text-align:center;color:#8b9186;font-size:13px;min-height:20px}.actions{display:flex;justify-content:center;gap:10px;margin-top:25px}.primary{background:#2c4d3c;color:#fff;padding:17px 42px;border:0;border-radius:12px;font-weight:700;box-shadow:0 4px 8px #2c4d3c18}.primary:hover{background:#3c654b}.secondary{background:#fff;border:1px solid #dce2d7;border-radius:12px;color:#63705e;padding:14px 18px}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #a5bc83;outline-offset:4px}.note{text-align:center;font-size:12px;color:#8e958b;margin-top:22px}.foot{margin:40px 0 0;border-top:1px solid #e2e5dc;padding:22px 0;display:flex;justify-content:space-between;font-size:11px;color:#949d8c}.guide{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:25px;color:#939c8c;font-size:10px}.guide span{display:flex;gap:5px;align-items:center;margin:0 4px}.guide i{height:7px;width:7px;border-radius:50%}@media(max-width:600px){header{padding:20px 22px}.tag{font-size:10px;letter-spacing:1px}main{margin-top:42px;padding:0 17px}.draw-card{padding:23px 16px;border-radius:20px}.balls{gap:8px;padding:36px 0 28px}.ball{width:clamp(35px,11.6vw,64px);height:clamp(35px,11.6vw,64px);font-size:23px}.primary{padding:16px 29px}.small-balls{gap:6px}.small-balls .ball{width:29px;height:29px}.foot{display:block;line-height:2}.intro p{font-size:13px}}
@media(prefers-reduced-motion:reduce){.ball.filled{animation:none}}
 .modes{display:flex;gap:8px;justify-content:center;margin:28px 0 0}.mode{border:1px solid #dce2d7;border-radius:10px;padding:12px 24px;background:white;color:#63705e}.mode[aria-pressed="true"]{background:#2c4d3c;color:white;border-color:#2c4d3c}.settings{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.settings[hidden]{display:none}.settings label{flex:1;min-width:100px;font-size:12px;color:#63705e}.settings input{display:block;width:100%;margin-top:8px;border:1px solid #dce2d7;border-radius:8px;padding:12px;font:inherit;font-size:16px;color:#243d33}.ball{min-width:0}.ball.event{width:auto;min-width:80px;padding:0 12px;font-size:23px}@media(max-width:600px){.ball.event{min-width:58px;height:58px;font-size:18px}}
</style></head>
<body>
<header><div class="brand"><span class="clover" aria-hidden="true">✳</span>행운 한 줌</div><div class="tag">A LITTLE LUCK, JUST FOR YOU</div></header>
<main><section class="intro"><div class="eyebrow" id="eyebrow">LOTTO 6 / 45</div><h1>오늘의 행운을 뽑아볼까요?</h1><p>작은 설렘이 필요한 순간,<br>버튼 한 번으로 나만의 행운 번호를 만나보세요.</p></section>
<div class="modes" role="group" aria-label="추첨 종류"><button class="mode" id="lotto-mode" aria-pressed="true">로또 6/45</button><button class="mode" id="event-mode" aria-pressed="false">이벤트 번호</button></div><section class="draw-card" aria-label="번호 추첨"><div class="card-top"><span class="label"><span class="dot"></span>나의 행운 번호</span><span id="range-label">01 — 45 · 6 NUMBERS</span></div><div class="settings" id="settings" hidden><label>시작 번호<input id="start" type="number" min="0" max="999999" step="1" value="1" required></label><label>끝 번호<input id="end" type="number" min="0" max="999999" step="1" value="100" required></label><label>뽑을 인원<input id="count" type="number" min="1" max="100" step="1" value="1" required></label></div><div class="balls" id="balls" aria-label="추첨 번호"><span class="ball">?</span><span class="ball">?</span><span class="ball">?</span><span class="ball">?</span><span class="ball">?</span><span class="ball">?</span></div><div class="status" id="status" role="status" aria-live="polite">어떤 번호가 당신을 기다리고 있을까요?</div><div class="actions"><button class="primary" id="draw">✳ &nbsp; 행운 번호 뽑기</button><button class="secondary" id="copy" disabled aria-label="추첨 번호 복사">번호 복사</button></div><div class="guide" id="guide"><span><i class="yellow"></i>1–10</span><span><i class="blue"></i>11–20</span><span><i class="red"></i>21–30</span><span><i class="gray"></i>31–40</span><span><i class="green"></i>41–45</span></div></section>
<p class="note" id="note">중복 없이 무작위로 추첨하고, 보기 좋게 오름차순으로 정렬해요.</p>
<footer class="foot"><span>✳ 행운은 가볍게, 즐거움은 오래.</span><span>재미로 즐기는 번호 생성기 · 당첨을 보장하지 않아요.</span></footer></main>
<script>
const $=id=>document.getElementById(id);let current=[],busy=false,mode='lotto';
try{localStorage.removeItem('lotto-history')}catch{}
function color(n){return n<=10?'yellow':n<=20?'blue':n<=30?'red':n<=40?'gray':'green'}
function ball(n){const el=document.createElement('span');el.className='ball filled '+(mode==='event'?'green event':color(n));el.textContent=n;return el}
function randomInt(max){const buf=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%max}
function pickNumbers(start,end,count){const selected=new Set();for(let j=end-start+1-count;j<end-start+1;j++){const candidate=randomInt(j+1);selected.add(selected.has(candidate)?j:candidate)}return [...selected].map(n=>n+start).sort((a,b)=>a-b)}
function settings(){if(mode==='lotto')return {start:1,end:45,count:6};const start=$('start').valueAsNumber,end=$('end').valueAsNumber,count=$('count').valueAsNumber;if(![start,end,count].every(Number.isInteger)||start<0||end>999999||start>end||count<1||count>100||count>end-start+1)throw new Error('0~999999 사이의 시작·끝 번호와 인원(1~100명)을 확인해 주세요. 인원은 번호 개수를 넘을 수 없어요.');return {start,end,count}}
function reset(){current=[];$('copy').disabled=true;$('balls').replaceChildren();for(let i=0;i<(mode==='lotto'?6:1);i++){const el=document.createElement('span');el.className='ball';el.textContent='?';$('balls').append(el)}$('status').textContent=mode==='lotto'?'어떤 번호가 당신을 기다리고 있을까요?':'번호 범위와 인원을 정한 뒤 추첨해 주세요.';$('draw').textContent='✳  '+(mode==='lotto'?'행운 번호 뽑기':'이벤트 번호 뽑기')}
function setMode(next){if(busy)return;mode=next;$('settings').hidden=mode!=='event';$('guide').hidden=mode==='event';$('guide').style.display=mode==='event'?'none':'';$('lotto-mode').setAttribute('aria-pressed',String(mode==='lotto'));$('event-mode').setAttribute('aria-pressed',String(mode==='event'));$('eyebrow').textContent=mode==='lotto'?'LOTTO 6 / 45':'EVENT NUMBER DRAW';$('range-label').textContent=mode==='lotto'?'01 — 45 · 6 NUMBERS':'나만의 범위 · 중복 없는 추첨';$('note').textContent='중복 없이 무작위로 추첨하고, 보기 좋게 오름차순으로 정렬해요.';reset()}
$('lotto-mode').addEventListener('click',()=>setMode('lotto'));$('event-mode').addEventListener('click',()=>setMode('event'));['start','end','count'].forEach(id=>$(id).addEventListener('input',()=>{if(!busy)reset()}));
$('draw').addEventListener('click',async()=>{if(busy)return;let config;try{config=settings()}catch(error){$('status').textContent=error.message;return}busy=true;const controls=[$('draw'),$('copy'),$('lotto-mode'),$('event-mode'),$('start'),$('end'),$('count')];controls.forEach(el=>el.disabled=true);$('draw').textContent='행운을 뽑는 중…';$('status').textContent='번호를 추첨하고 있어요.';try{current=pickNumbers(config.start,config.end,config.count);const container=$('balls');container.replaceChildren();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(const n of current){if(!reduced)await new Promise(r=>setTimeout(r,Math.min(180,1200/current.length)));container.append(ball(n))}$('status').textContent='추첨 번호: '+current.join(', ')}catch{$('status').textContent='추첨 중 문제가 생겼어요. 다시 시도해 주세요.';current=[]}finally{controls.forEach(el=>el.disabled=false);$('copy').disabled=!current.length;$('draw').textContent='✳  한 번 더 뽑기';busy=false}});
$('copy').addEventListener('click',async()=>{const value=current.join(', ');try{await navigator.clipboard.writeText(value);$('status').textContent='번호를 복사했어요: '+value}catch{$('status').textContent='번호를 선택해서 복사해 주세요: '+value}});
</script></body></html>
